# itam.example.go.kr — nginx 리버스 프록시 (TLS 종단 → 내부 Next standalone)
# 설치 시 setup-nginx.sh 가 /etc/nginx/conf.d/itam.conf 로 배치한다.
#
# [같은 서버 공존]  share.example.go.kr(기존 서비스)와 한 nginx 에 공존할 수 있도록:
#   - server_name 을 itam.example.go.kr 로 명시(SNI 분리) — default_server 로 두지 않는다.
#   - upstream 포트는 __ITAM_PORT__ 플레이스홀더(설치 스크립트가 실제 포트로 치환).
#     share 앱이 127.0.0.1:3000 을 쓰면 itam 은 3100 등 다른 포트로 뜬다.
#   - 인증서는 공존시스템(share)의 정식 인증서를 공유한다(별도 itam.crt 생성 안 함).
#     같은 *.example.go.kr 와일드카드라 itam.example.go.kr 도 커버 — 갱신은 공존시스템 한 곳만.
#     설치 스크립트가 __SSL_CRT__/__SSL_KEY__ 를 실제 경로로 치환(기본 shared.crt/key).

server {
    listen 443 ssl;
__HTTP2__
    server_name itam.example.go.kr;
    server_tokens off;

    ssl_certificate     __SSL_CRT__;      # 공존시스템 공유 인증서(fullchain, *.example.go.kr)
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 엑셀 임포트 등 업로드 여유 (자산/유지관리 대상 대량 업로드)
    client_max_body_size 100M;

    # 보안 헤더 — 앱(next.config CSP)과 중복되지만 프록시단에서도 강제.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:__ITAM_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name itam.example.go.kr;   # default_server 로 두지 않음 — share 등 기존 80 블록과 공존
    server_tokens off;
    return 301 https://$host$request_uri;
}
